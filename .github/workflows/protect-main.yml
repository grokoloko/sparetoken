name: protect-main

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mvp:
    name: unittest-mvp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: TDD gate — essencial do MVP
        run: python3 -m unittest discover -s tests -v
