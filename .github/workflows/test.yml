name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: HEAD author is sparetoken-shop
        if: github.event_name == 'push'
        run: |
          email="$(git log -1 --format='%ae')"
          test "$email" = "sparetoken-shop@users.noreply.github.com"
      - name: unit tests
        run: python3 -m unittest discover -s tests -v
